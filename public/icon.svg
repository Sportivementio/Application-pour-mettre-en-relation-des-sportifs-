<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#1c1c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond sombre arrondi avec gradient -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Glow rouge central -->
  <rect width="512" height="512" rx="100" fill="url(#glow)"/>

  <!-- "S" rouge italique en haut -->
  <text x="256" y="220"
        font-family="'Oswald', 'Arial Black', Impact, sans-serif"
        font-size="240"
        font-weight="900"
        font-style="italic"
        text-anchor="middle"
        fill="#e63946"
        transform="skewX(-10) translate(45,0)">S</text>

  <!-- Trait rouge séparateur -->
  <rect x="154" y="262" width="204" height="14" rx="7" fill="#e63946"/>

  <!-- "IO" blanc italique en bas -->
  <text x="256" y="410"
        font-family="'Oswald', 'Arial Black', Impact, sans-serif"
        font-size="160"
        font-weight="900"
        font-style="italic"
        text-anchor="middle"
        fill="#f4f4f5"
        transform="skewX(-10) translate(45,0)">IO</text>
</svg>
